<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Create Account | BlueThread</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div data-nav></div>
    <main class="auth-page">
      <form class="auth-card needs-validation" novalidate data-register-form>
        <div class="text-center">
          <i class="bi bi-person-plus text-primary fs-1"></i>
          <h2>Create account</h2>
          <p class="text-secondary">Join BlueThread and discover your style.</p>
        </div>
        <div class="row g-3">
          <div class="col-6">
            <label class="form-label">First Name</label
            ><input class="form-control" required />
          </div>
          <div class="col-6">
            <label class="form-label">Last Name</label
            ><input class="form-control" required />
          </div>
          <div class="col-12">
            <label class="form-label">Email</label
            ><input type="email" class="form-control" required />
          </div>
          <div class="col-12">
            <label class="form-label">Phone</label
            ><input type="tel" class="form-control" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Password</label
            ><input
              type="password"
              class="form-control"
              required
              minlength="6"
              id="password"
            />
          </div>
          <div class="col-md-6">
            <label class="form-label">Confirm Password</label
            ><input
              type="password"
              class="form-control"
              required
              id="confirm-password"
            />
            <div class="invalid-feedback">Passwords must match.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Gender</label
            ><select class="form-select" required>
              <option value="">Choose...</option>
              <option>Female</option>
              <option>Male</option>
              <option>Prefer not to say</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Date of Birth</label
            ><input type="date" class="form-control" required />
          </div>
        </div>
        <div class="form-check mt-3">
          <input
            class="form-check-input"
            type="checkbox"
            id="terms"
            required
          /><label class="form-check-label" for="terms"
            >I agree to the Terms & Conditions</label
          >
        </div>
        <button class="btn btn-primary w-100 mt-4" type="submit">
          Register
        </button>
        <p class="text-center small mt-3 mb-0">
          Already have an account? <a href="login.html">Login</a>
        </p>
      </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
