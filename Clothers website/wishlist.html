<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Wishlist | BlueThread</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div data-nav></div>
    <header class="page-header">
      <div class="container">
        <h1>My Wishlist</h1>
        <p class="mb-0">Your saved style inspiration.</p>
      </div>
    </header>
    <main class="py-5">
      <div class="container">
        <div class="row g-4" id="wishlist-products"></div>
        <div id="empty-wishlist" class="text-center py-5 d-none">
          <i class="bi bi-heart fs-1 text-primary"></i>
          <h4 class="mt-3">Your wishlist is empty</h4>
          <a class="btn btn-primary" href="shop.html">Explore products</a>
        </div>
      </div>
    </main>
    <div data-footer></div>
    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
