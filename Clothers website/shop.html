<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Shop | BlueThread</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body data-page="shop">
    <div data-nav></div>
    <header class="page-header">
      <div class="container">
        <h1>Shop All Products</h1>
        <nav>
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="index.html">Home</a></li>
            <li class="breadcrumb-item active">Shop</li>
          </ol>
        </nav>
      </div>
    </header>
    <main class="py-5">
      <div class="container">
        <div class="row g-4">
          <aside class="col-lg-3">
            <div class="filter-card">
              <div class="d-flex justify-content-between">
                <h5>Filters</h5>
                <button class="btn btn-sm btn-link p-0" data-clear-filters>
                  Clear
                </button>
              </div>
              <h6>Category</h6>
              <select
                class="form-select form-select-sm mb-3"
                data-filter="category"
              >
                <option value="">All categories</option>
                <option>Men</option>
                <option>Women</option>
                <option>Kids</option>
                <option>Accessories</option>
              </select>
              <h6>Gender</h6>
              <div class="mb-3">
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    data-gender="Men"
                    id="m"
                  /><label class="form-check-label" for="m">Men</label>
                </div>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    data-gender="Women"
                    id="w"
                  /><label class="form-check-label" for="w">Women</label>
                </div>
              </div>
              <h6>Size</h6>
              <div class="d-flex gap-2 mb-3">
                <button class="btn btn-outline-secondary btn-sm">S</button
                ><button class="btn btn-outline-secondary btn-sm">M</button
                ><button class="btn btn-outline-secondary btn-sm">L</button>
              </div>
              <h6>Color</h6>
              <div class="d-flex gap-2 mb-3">
                <i class="color-choice bg-dark"></i
                ><i class="color-choice bg-primary"></i
                ><i class="color-choice bg-danger"></i
                ><i class="color-choice bg-light"></i>
              </div>
              <h6>Price Range</h6>
              <input
                type="range"
                class="form-range mb-3"
                min="10"
                max="200"
                value="200"
                data-price-filter
              />
              <h6>Brand</h6>
              <select class="form-select form-select-sm mb-3">
                <option>All brands</option>
                <option>BlueThread</option>
                <option>Urban Edit</option>
              </select>
              <h6>Rating</h6>
              <select class="form-select form-select-sm">
                <option value="0">Any rating</option>
                <option value="4">4 stars & up</option>
                <option value="3">3 stars & up</option>
              </select>
            </div>
          </aside>
          <section class="col-lg-9">
            <div class="d-flex justify-content-between align-items-center mb-4">
              <p class="mb-0 text-secondary">
                <span data-result-count>0</span> products found
              </p>
              <select class="form-select w-auto" data-sort>
                <option value="featured">Featured</option>
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>
                <option value="new">Newest</option>
                <option value="best">Best Selling</option>
              </select>
            </div>
            <div class="row g-4 product-list"></div>
            <nav class="mt-5">
              <ul class="pagination justify-content-center">
                <li class="page-item disabled">
                  <a class="page-link">Previous</a>
                </li>
                <li class="page-item active"><a class="page-link">1</a></li>
                <li class="page-item"><a class="page-link">2</a></li>
                <li class="page-item"><a class="page-link">3</a></li>
                <li class="page-item"><a class="page-link">Next</a></li>
              </ul>
            </nav>
          </section>
        </div>
      </div>
    </main>
    <div data-footer></div>
    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
