<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Kids' Collection | BlueThread</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body data-page="kids">
    <div data-nav></div>
    <main>
      <section class="page-header text-start">
        <div class="container">
          <span class="eyebrow">Play-ready style</span>
          <h1>Kids' Collection</h1>
          <p class="mb-0">
            Colorful, comfortable boys' and girls' clothing, shoes, and
            accessories.
          </p>
        </div>
      </section>
      <section class="py-5">
        <div class="container">
          <div class="d-flex justify-content-between mb-4">
            <h3>Little favorites</h3>
            <select class="form-select w-auto" data-sort>
              <option value="featured">Sort: Featured</option>
              <option value="low">Price: Low to High</option>
              <option value="high">Price: High to Low</option>
            </select>
          </div>
          <div class="row g-4 product-list" data-collection="Kids"></div>
        </div>
      </section>
    </main>
    <div data-footer></div>
    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
