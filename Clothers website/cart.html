<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Shopping Cart | BlueThread</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div data-nav></div>
    <header class="page-header">
      <div class="container"><h1>Your Shopping Cart</h1></div>
    </header>
    <main class="py-5">
      <div class="container">
        <div class="row g-4">
          <section class="col-lg-8">
            <div id="cart-items"></div>
            <div id="empty-cart" class="text-center py-5 d-none">
              <i class="bi bi-bag fs-1 text-primary"></i>
              <h4 class="mt-3">Your cart is empty</h4>
              <a class="btn btn-primary" href="shop.html">Start Shopping</a>
            </div>
            <a href="shop.html" class="btn btn-outline-primary mt-4"
              ><i class="bi bi-arrow-left"></i> Continue Shopping</a
            >
          </section>
          <aside class="col-lg-4">
            <div class="card summary-card">
              <div class="card-body p-4">
                <h4>Order Summary</h4>
                <div class="d-flex justify-content-between mt-4">
                  <span>Subtotal</span><b data-summary="subtotal">$0.00</b>
                </div>
                <div class="d-flex justify-content-between mt-2">
                  <span>Discount</span><b data-summary="discount">-$0.00</b>
                </div>
                <div class="d-flex justify-content-between mt-2">
                  <span>Shipping</span><b data-summary="shipping">$0.00</b>
                </div>
                <div class="d-flex justify-content-between mt-2">
                  <span>Tax</span><b data-summary="tax">$0.00</b>
                </div>
                <hr />
                <div class="d-flex justify-content-between fs-5">
                  <b>Total</b
                  ><b class="text-primary" data-summary="total">$0.00</b>
                </div>
                <a class="btn btn-primary w-100 mt-4" href="checkout.html"
                  >Proceed to Checkout <i class="bi bi-arrow-right"></i
                ></a>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </main>
    <div data-footer></div>
    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
