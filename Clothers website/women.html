<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Women's Collection | BlueThread</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body data-page="women">
    <div data-nav></div>
    <main>
      <section class="page-header text-start">
        <div class="container">
          <span class="eyebrow">Made to be noticed</span>
          <h1>Women's Collection</h1>
          <p class="mb-0">
            Dresses, tops, denim, skirts, jackets, shoes and bags with
            effortless style.
          </p>
        </div>
      </section>
      <section class="py-5">
        <div class="container">
          <div class="d-flex justify-content-between mb-4">
            <h3>Designed for you</h3>
            <select class="form-select w-auto" data-sort>
              <option value="featured">Sort: Featured</option>
              <option value="low">Price: Low to High</option>
              <option value="high">Price: High to Low</option>
            </select>
          </div>
          <div class="row g-4 product-list" data-collection="Women"></div>
          <nav class="mt-5">
            <ul class="pagination justify-content-center">
              <li class="page-item active"><a class="page-link">1</a></li>
              <li class="page-item"><a class="page-link">2</a></li>
              <li class="page-item"><a class="page-link">Next</a></li>
            </ul>
          </nav>
        </div>
      </section>
    </main>
    <div data-footer></div>
    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
