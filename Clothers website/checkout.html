<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Checkout | BlueThread</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div data-nav></div>
    <main class="py-5 bg-light">
      <div class="container">
        <h1 class="mb-4">Checkout</h1>
        <div class="row g-4">
          <section class="col-lg-8">
            <form
              class="needs-validation bg-white rounded-3 p-4"
              novalidate
              data-checkout-form
            >
              <h4>Customer Information</h4>
              <div class="row g-3 mt-1">
                <div class="col-md-6">
                  <label class="form-label">First Name</label
                  ><input class="form-control" required />
                  <div class="invalid-feedback">First name is required.</div>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Last Name</label
                  ><input class="form-control" required />
                  <div class="invalid-feedback">Last name is required.</div>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Email</label
                  ><input type="email" class="form-control" required />
                  <div class="invalid-feedback">Enter a valid email.</div>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Phone</label
                  ><input type="tel" class="form-control" required />
                  <div class="invalid-feedback">Phone is required.</div>
                </div>
                <div class="col-12">
                  <label class="form-label">Address</label
                  ><input class="form-control" required />
                  <div class="invalid-feedback">Address is required.</div>
                </div>
                <div class="col-md-4">
                  <label class="form-label">City</label
                  ><input class="form-control" required />
                </div>
                <div class="col-md-4">
                  <label class="form-label">State</label
                  ><input class="form-control" required />
                </div>
                <div class="col-md-4">
                  <label class="form-label">Postal Code</label
                  ><input class="form-control" required />
                </div>
                <div class="col-12">
                  <label class="form-label">Country</label
                  ><select class="form-select" required>
                    <option value="">Choose...</option>
                    <option>Myanmar</option>
                    <option>United States</option>
                    <option>United Kingdom</option>
                  </select>
                </div>
              </div>
              <h4 class="mt-5">Payment Method</h4>
              <div class="border rounded p-3">
                <div class="form-check mb-2">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="payment"
                    id="card"
                    checked
                  /><label class="form-check-label" for="card"
                    ><i class="bi bi-credit-card"></i> Credit / Debit
                    Card</label
                  >
                </div>
                <div class="form-check mb-2">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="payment"
                    id="paypal"
                  /><label class="form-check-label" for="paypal"
                    ><i class="bi bi-paypal"></i> PayPal</label
                  >
                </div>
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="payment"
                    id="cod"
                  /><label class="form-check-label" for="cod"
                    >Cash on Delivery</label
                  >
                </div>
              </div>
              <button class="btn btn-primary w-100 mt-4" type="submit">
                Place Order <i class="bi bi-lock"></i>
              </button>
            </form>
          </section>
          <aside class="col-lg-4">
            <div class="card summary-card">
              <div class="card-body p-4">
                <h4>Order Summary</h4>
                <div id="checkout-products" class="small"></div>
                <hr />
                <div class="d-flex justify-content-between">
                  <span>Subtotal</span><b data-summary="subtotal"></b>
                </div>
                <div class="d-flex justify-content-between mt-2">
                  <span>Shipping</span><b data-summary="shipping"></b>
                </div>
                <div class="d-flex justify-content-between mt-2">
                  <span>Tax</span><b data-summary="tax"></b>
                </div>
                <hr />
                <div class="d-flex justify-content-between fs-5">
                  <b>Total</b><b class="text-primary" data-summary="total"></b>
                </div>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </main>
    <div data-footer></div>
    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
