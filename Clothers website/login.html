<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login | BlueThread</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div data-nav></div>
    <main class="auth-page">
      <form class="auth-card needs-validation" novalidate data-auth-form>
        <div class="text-center">
          <i class="bi bi-person-circle text-primary fs-1"></i>
          <h2>Welcome back</h2>
          <p class="text-secondary">Sign in to your BlueThread account.</p>
        </div>
        <label class="form-label mt-3">Email address</label
        ><input type="email" class="form-control" required />
        <div class="invalid-feedback">Enter a valid email.</div>
        <label class="form-label mt-3">Password</label
        ><input type="password" class="form-control" required minlength="6" />
        <div class="invalid-feedback">Password must have 6 characters.</div>
        <div class="d-flex justify-content-between mt-3 small">
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              id="remember"
            /><label class="form-check-label" for="remember">Remember me</label>
          </div>
          <a href="#">Forgot password?</a>
        </div>
        <button class="btn btn-primary w-100 mt-4" type="submit">Login</button
        ><button class="btn btn-outline-secondary w-100 mt-2" type="button">
          <i class="bi bi-google"></i> Continue with Google
        </button>
        <p class="text-center small mt-4 mb-0">
          Don't have an account? <a href="register.html">Create Account</a>
        </p>
      </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
