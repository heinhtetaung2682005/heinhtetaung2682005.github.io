<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Contact Us | BlueThread</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div data-nav></div>
    <header class="page-header">
      <div class="container">
        <h1>We'd Love to Hear From You</h1>
        <p class="mb-0">Our team is here to help with anything you need.</p>
      </div>
    </header>
    <main class="py-5">
      <div class="container">
        <div class="row g-5">
          <section class="col-lg-4">
            <span class="eyebrow">Get in touch</span>
            <h2>Contact Information</h2>
            <div class="mt-4">
              <p>
                <i class="bi bi-geo-alt-fill text-primary me-2"></i
                ><b>Address</b><br /><span class="ms-4"
                  >125 Fashion Street, Yangon</span
                >
              </p>
              <p>
                <i class="bi bi-telephone-fill text-primary me-2"></i
                ><b>Phone</b><br /><span class="ms-4">+95 9 123 456 789</span>
              </p>
              <p>
                <i class="bi bi-envelope-fill text-primary me-2"></i><b>Email</b
                ><br /><span class="ms-4">hello@bluethread.com</span>
              </p>
              <p>
                <i class="bi bi-clock-fill text-primary me-2"></i
                ><b>Opening Hours</b><br /><span class="ms-4"
                  >Mon–Sat: 9:00 AM – 6:00 PM</span
                >
              </p>
            </div>
          </section>
          <section class="col-lg-8">
            <form class="needs-validation" novalidate data-contact-form>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Name</label
                  ><input class="form-control" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Email</label
                  ><input class="form-control" type="email" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Phone</label
                  ><input class="form-control" required />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Subject</label
                  ><input class="form-control" required />
                </div>
                <div class="col-12">
                  <label class="form-label">Message</label
                  ><textarea class="form-control" rows="5" required></textarea>
                </div>
              </div>
              <button class="btn btn-primary mt-4" type="submit">
                Send Message <i class="bi bi-send"></i>
              </button>
            </form>
          </section>
        </div>
        <div class="map-placeholder mt-5">
          <i class="bi bi-geo-alt-fill"></i>
        </div>
      </div>
    </main>
    <div data-footer></div>
    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
