<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="jquery-4.0.0.min.js"></script>
</head>
<body>
    <!-- Add Student Form -->
    <div id="addStudent">
        <h3>Add New Student</h3>
        Name : <input type="text" name="name" id="name"><br><br>
        Email: <input type="email" name="email" id="email"><br><br>
        Phone: <input type="number" name="phone" id="phone"><br><br>
        Year: <select name="year" id="year">
            <option value="">Choose Year</option>
            <option value="First Year">First Year</option>
            <option value="Second Year">Second Year</option>
            <option value="Third Year">Third Year</option>
        </select><br><br>
        <button id="add">Add Student</button>
    </div>
    // Update Student Form
    <div id="updateStudent">
        <h3>Update Student</h3>
        Name : <input type="text" name="name" id="upd_name" ><br><br>
        Email: <input type="email" name="email" id="upd_email"><br><br>
        Phone: <input type="number" name="phone" id="upd_phone"><br><br>
        Year: <select name="year" id="upd_year">
            <option value="">Choose Year</option>
            <option value="First Year">First Year</option>
            <option value="Second Year">Second Year</option>
            <option value="Third Year">Third Year</option>
        </select><br><br>
        <button id="update">Update Student</button>
    </div>

    <h3>Students List</h3>
    <table border="1" cellspacing="0" cellpadding="20">
        <thead>
            <tr>
                <th>No.</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Year</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="tbody">
            <tr>
                <td>1</td>
                <td>Kaung Htet Aung</td>
                <td>kaunghtetaung@gmail.com</td>
                <td>09877887887</td>
                <td>Second Year</td>
                <td>
                    <button>Delete</button>
                    <button>Edit</button>
                </td>
            </tr>
        </tbody>
    </table>

    <script>
        $(document).ready(function(){
            $('#updateStudent').hide();
            //
            $('#add').click(function(){
                //input ထဲက data တစ်ခုချင်းစီကိုယ်လက်ခံ
                let name = $('#name').val();
                let email = $('#email').val();
                let phone = $('#phone').val();
                let year = $('#year').val();
                console.log(name,email,phone,year);

                //လက်ခံထားတဲ့ dataတွေကို obj တည်ဆောက်
                let students = {
                    stu_name:name,
                    stu_email:email,
                    stu_phone:phone,
                    stu_year:year,
                }
                console.log(students);

                //variable အလွတ် ကြောငြာ
                let studnetArray;

                //localstorage ထဲက data ကိုလက်ခံရယူ
                let studentData = localStorage.getItem('students_key');
                console.log('student data is' +studentData);

                //if သည် localStorage က null ဖြစ်နေတဲ့ချိန် တနည်းအားဖြင့် ဘာ data မှာမရှိချိန်မှာလုပ်
                if(studentData == null){
                    studnetArray = [];
                }else{
                    //else က localStorage မှာ data ရှိမှလုပ်မယ်
                    //ရှိတဲ့ data က string ဖြစ်နေတဲ့အတွက် JSON.parse() နဲ့ array ပြောင်းပေးရမယ်
                    studnetArray = JSON.parse(studentData);
                }

                //localStorage ထဲမှာ ဘာမှမရှိသေးရင် array index 0 အနေနဲ့ variable studentArray ထဲကိုသိမ်းသွား
                //localStorage ထဲမှာ data ရှိခဲ့မယ်ဆိုရင် variable studentArray ထဲကို next index (eg.1)အနေနဲ့သိမ်းသွားမယ်
                studnetArray.push(students);
                console.log(studnetArray);


                //array ကို JSON String ပြောင်းပြီး localStorage ထဲသိမ်းမယ်
                let studentString = JSON.stringify(studnetArray);
                console.log(studentString);
                localStorage.setItem('students_key',studentString);

                function getData(){
                    let studentData = localStorage.getItem('students_key');
                    let studnetArray = JSON.parse(studentData);
                    console.log(studnetArray);

                    let html = '';
                    for(let i=0; i<studnetArray.length; i++){
                        html += `<tr>
                                    <td>${i+1}</td>
                                    <td>${studnetArray[i].stu_name}</td>
                                    <td>${studnetArray[i].stu_email}</td>
                                    <td>${studnetArray[i].stu_phone}</td>
                                    <td>${studnetArray[i].stu_year}</td>
                                    <td>
                                        <button>Delete</button>
                                        <button>Edit</button>
                                    </td>
                                </tr>`;
                    }
                    $('#tbody').html(html);
                    //for delete button
                    $('#tbody button:first-child').click(function(){
                        let index = $(this).parent().parent().index();
                        console.log(index);
                        studnetArray.splice(index,1);
                        let studentString = JSON.stringify(studnetArray);
                        localStorage.setItem('students_key',studentString);
                        getData();
                    })
                    //for edit button
                    $('#tbody button:last-child').click(function(){
                        let index = $(this).parent().parent().index();
                        console.log(index);
                        $('#updateStudent').show();
                        $('#upd_name').val(studnetArray[index].stu_name);
                        $('#upd_email').val(studnetArray[index].stu_email);
                        $('#upd_phone').val(studnetArray[index].stu_phone);
                        $('#upd_year').val(studnetArray[index].stu_year);
                    })
                }
            
           
                

            
            })
        })
    </script>

</body>
</html>
